name: Add Preview URL to PR

on: deployment_status

permissions:
  contents: read
  pull-requests: write

jobs:
  update-pr-body:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment != 'production'
    runs-on: ubuntu-latest
    steps:
      - name: Update PR body with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl =
              context.payload.deployment_status.environment_url ||
              context.payload.deployment_status.target_url;
            if (!previewUrl) return;

            const ref = context.payload.deployment.ref;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              head: `${context.repo.owner}:${ref}`,
            });

            const marker = "<!-- cloudflare-preview-url -->";
            const section = `${marker}\n🚀 **Preview:** ${previewUrl}`;

            for (const pr of prs) {
              let body = pr.body || "";
              if (body.includes(marker)) {
                body = body.replace(
                  new RegExp(`${marker}.*`, "s"),
                  section,
                );
              } else {
                body = `${body}\n\n${section}`;
              }
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                body,
              });
            }
